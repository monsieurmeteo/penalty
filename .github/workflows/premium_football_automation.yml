name: Premium Football (Penalty & Over 2.5) Automation

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests typing_extensions beautifulsoup4

      - name: 🌐 Scrape Matches from Pronosoft
        run: |
          python scripts/parse_pronosoft.py

      - name: ⚡ Run Premium 1XBET Scan (Over 2.5 & Penalty)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: "gregory.langlet@sfr.fr"
        run: |
          python scripts/auto_premium_1xbet.py

      - name: 📄 Upload Premium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-football-report
          path: rapport_premium_1xbet.md
