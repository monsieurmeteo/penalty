name: Premium Football (Penalty & Over 2.5) Automation

on:
  schedule:
    - cron: '0 */3 * * *' # Runs automatically every 3 hours 24/7
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: penalty-scan
  cancel-in-progress: true

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests typing_extensions beautifulsoup4

      - name: ⚡ Run Premium Unibet France Scan (Over 2.5 & Penalty)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: "gregory.langlet@sfr.fr, langlet.gregory@gmail.com"
        run: |
          python scripts/auto_premium_unibet.py

      - name: 📄 Upload Premium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-football-report
          path: report.md

      - name: 💾 Commit and Push Odds History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_odds.json || true
          git commit -m "Auto-update odds history [skip ci]" || true
          git push || true
