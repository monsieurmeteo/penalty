<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Flashscore Live — Suivi Exclusif Combinés M1 & M2</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Flashscore Combos">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --header-bg: #ffffff;
            --border: #e2e8f0;
            --border-subtle: #f1f5f9;
            --accent: #059669;
            --text: #0f172a;
            --text-secondary: #475569;
            --muted: #64748b;
            --yellow-star: #f59e0b;
            --blue-pre: #2563eb;
            --crimson: #dc2626;
            --crimson-soft: #fef2f2;
            --crimson-border: #f87171;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding: 8px 8px 80px 8px; min-height: 100vh; }
        .container { max-width: 960px; margin: 0 auto; }
        
        /* HEADER ULTRA-COMPACT */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 6px 10px; 
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 8px; 
        }
        .logo { 
            font-size: 15px; 
            font-weight: 900; 
            letter-spacing: -0.2px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .logo span.bolt { color: #10b981; }
        .logo span.sub { font-size: 9px; font-weight: 800; background: #ede9fe; color: #6d28d9; padding: 1px 5px; border-radius: 4px; border: 1px solid #c4b5fd; }
        
        .header-actions { display: flex; align-items: center; gap: 5px; }
        .sound-btn { 
            background: #f8fafc; 
            border: 1px solid #cbd5e1; 
            color: #334155; 
            padding: 4px 8px; 
            border-radius: 12px; 
            font-size: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 3px; 
            transition: all 0.15s;
        }
        .sound-btn:hover { background: #f1f5f9; }
        .sound-btn.active { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .sound-btn.test-btn { background: #ede9fe; border-color: #8b5cf6; color: #6d28d9; }
        .sound-btn.test-btn:hover { background: #ddd6fe; }

        .live-badge { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            background: #ecfdf5; 
            border: 1px solid #a7f3d0; 
            padding: 3px 7px; 
            border-radius: 12px; 
            font-size: 9px; 
            font-weight: 800; 
            color: #059669; 
        }
        .live-badge.offline { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
        .pulse { width: 5px; height: 5px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        /* BARRE DE RECHERCHE ET ONGLETS COMPACTS */
        .toolbar { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
        .search-bar { 
            width: 100%; 
            padding: 6px 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: #ffffff; 
            color: #0f172a; 
            font-size: 12px; 
            outline: none; 
            box-shadow: var(--card-shadow);
        }
        .search-bar::placeholder { color: #94a3b8; }
        .search-bar:focus { border-color: #3b82f6; }
        
        .tabs-row { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 3px; 
            width: 100%; 
            background: #e2e8f0;
            padding: 3px;
            border-radius: 8px;
        }
        .tab-btn { 
            background: transparent; 
            border: none; 
            color: #475569; 
            padding: 5px 2px; 
            border-radius: 6px; 
            font-size: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 2px; 
            white-space: nowrap; 
            transition: background 0.1s, color 0.1s;
        }
        .tab-btn:hover { color: #0f172a; }
        .tab-btn.active { background: #ffffff; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .tab-btn.active-live { background: #fee2e2; color: #b91c1c; }
        .tab-btn.active-pre { background: #dbeafe; color: #1d4ed8; }
        .tab-btn.active-fav { background: #fef3c7; color: #b45309; }
        .tab-btn.active-combos { background: #ede9fe; color: #6d28d9; }

        /* 📋 TABLEAU COMPACT FLASHSCORE PRO */
        .league-group { 
            margin-bottom: 8px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            overflow: hidden; 
            background: var(--panel); 
            box-shadow: var(--card-shadow);
        }
        .league-header { 
            background: #f1f5f9; 
            padding: 4px 8px; 
            font-size: 10px; 
            font-weight: 800; 
            color: #334155; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            text-transform: uppercase; 
            letter-spacing: 0.3px; 
        }
        .league-header span.count { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 9px; color: #475569; font-weight: 800; }
        
        /* ⚡ LIGNE DE MATCH COMPACTE (38PX SEULEMENT !) */
        .match-row { 
            display: flex; 
            align-items: center; 
            padding: 5px 8px; 
            font-size: 11px; 
            border-bottom: 1px solid var(--border-subtle); 
            cursor: pointer; 
            gap: 6px; 
            background: #ffffff;
            transition: background 0.1s;
            position: relative;
        }
        .match-row:last-child { border-bottom: none; }
        .match-row:hover { background: #f8fafc; }
        
        .star-col { width: 18px; text-align: center; cursor: pointer; color: #cbd5e1; font-size: 14px; user-select: none; flex: 0 0 18px; }
        .star-col.starred { color: var(--yellow-star); }

        .status-col { 
            width: 58px; 
            font-size: 11px; 
            font-weight: 900; 
            color: var(--accent); 
            flex: 0 0 58px; 
            white-space: nowrap;
        }
        .status-col.pre-match { color: var(--blue-pre); font-size: 10px; }
        .status-col.finished { color: var(--muted); font-size: 10px; }

        .teams-block {
            display: flex;
            align-items: center;
            flex: 1 1 auto;
            min-width: 0;
            gap: 6px;
        }

        .team-home { 
            text-align: right; 
            flex: 1 1 0; 
            min-width: 0; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            font-weight: 700; 
            color: #0f172a; 
            font-size: 12px;
        }
        .team-away { 
            text-align: left; 
            flex: 1 1 0; 
            min-width: 0; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            font-weight: 700; 
            color: #0f172a; 
            font-size: 12px;
        }
        
        /* SCORE COMPACT */
        .score-box { 
            text-align: center; 
            font-size: 12px; 
            font-weight: 900; 
            background: #f1f5f9; 
            border: 1px solid #cbd5e1;
            padding: 1px 6px; 
            border-radius: 4px; 
            color: #0f172a; 
            flex: 0 0 auto; 
            min-width: 42px; 
            letter-spacing: 0.5px;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.04);
        }

        /* 👑 BADGE GAGNÉ */
        .won-badge-col {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            min-width: 78px;
            justify-content: flex-end;
        }
        .score-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 900;
            white-space: nowrap;
        }
        .score-status-badge.won-lead2 {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #15803d;
        }
        .score-status-badge.won-final {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #15803d;
        }
        .score-status-badge.live {
            background: #fef3c7;
            border: 1px solid #fde68a;
            color: #b45309;
        }
        .score-status-badge.lost {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
        }

        .combos-tag-col {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
        }
        .badge-combo-indicator { 
            background: #ede9fe; 
            color: #6d28d9; 
            border: 1px solid #c4b5fd; 
            font-size: 8px; 
            font-weight: 900; 
            padding: 1px 4px; 
            border-radius: 3px; 
            text-transform: uppercase; 
            cursor: pointer;
        }

        /* 🚨 ALERTE BUT (20 SECONDES) */
        .match-row.goal-flash {
            background: #fff5f5 !important;
            border-left: 3px solid #ef4444 !important;
        }
        .match-row.goal-flash .score-box {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
            animation: pulseScore 0.6s infinite alternate;
        }
        @keyframes pulseScore {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* TIROIR ÉVÉNEMENTS AU CLIC */
        .match-drawer {
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            padding: 4px 10px 6px 36px;
            font-size: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .event-pill-mini { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; display: inline-flex; align-items: center; gap: 2px; background: #ffffff; border: 1px solid #e2e8f0; color: #334155; }
        .event-pill-mini.goal { background: #ecfdf5; border-color: #a7f3d0; color: #047857; font-weight: 800; }
        .event-pill-mini.redcard { background: #fee2e2; border-color: #fecaca; color: #b91c1c; font-weight: 800; }

        /* 📱 BARRE FIXE BAS */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            height: 48px; 
            background: rgba(255, 255, 255, 0.96); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            z-index: 9999; 
            box-shadow: 0 -1px 4px rgba(0,0,0,0.03);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--muted); text-decoration: none; font-size: 9px; font-weight: 800; cursor: pointer; }
        .nav-item .icon { font-size: 15px; }
        .nav-item.active { color: #10b981; }
        .nav-item.active-live { color: #ef4444; }
        .nav-item.active-pre { color: #2563eb; }
        .nav-item.active-fav { color: #f59e0b; }
        .nav-item.active-combos { color: #7c3aed; }

        /* 🎫 VUE COMBINÉS */
        .combos-container-view { display: flex; flex-direction: column; gap: 8px; }
        .combos-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 2px; }
        .combos-kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 3px; text-align: center; box-shadow: var(--card-shadow); }
        .combos-kpi-val { font-size: 14px; font-weight: 900; }
        .combos-kpi-sub { font-size: 8px; color: var(--muted); font-weight: 800; text-transform: uppercase; margin-top: 1px; }

        .combos-subtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 2px; }
        .subtab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 6px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; text-align: center; box-shadow: var(--card-shadow); }
        .subtab-btn.active { background: #dbeafe; border-color: #3b82f6; color: #1e40af; }
        .subtab-btn.active-m2 { background: #ede9fe; border-color: #8b5cf6; color: #5b21b6; }

        .combos-filters-row { display: flex; gap: 3px; margin-bottom: 4px; overflow-x: auto; padding-bottom: 2px; }
        .cfilter-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 3px 8px; border-radius: 10px; font-size: 9px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .cfilter-btn.active { background: #0f172a; border-color: #0f172a; color: #fff; }

        .stake-bar-mini { display: flex; justify-content: space-between; align-items: center; background: #ffffff; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; font-size: 10px; font-weight: 800; }
        .stake-btn-mini { background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; cursor: pointer; }
        .stake-btn-mini.active { background: #2563eb; border-color: #1d4ed8; color: #fff; }

        .ticket-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; overflow: hidden; box-shadow: var(--card-shadow); }
        .ticket-card.is-won { border-left: 4px solid #10b981; background: #f0fdf4; }
        .ticket-card.is-lost { border-left: 4px solid #ef4444; }
        .ticket-card.is-live { border-left: 4px solid #f59e0b; }

        .ticket-header { background: #f8fafc; padding: 5px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; border-bottom: 1px solid var(--border); }
        .ticket-odds-badge { background: #2563eb; color: #fff; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .ticket-res-badge { padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: 800; }
        .ticket-res-badge.won { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .ticket-res-badge.lost { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .ticket-res-badge.live { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .ticket-res-badge.pending { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }

        .ticket-leg { padding: 5px 8px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; }
        .ticket-leg:last-child { border-bottom: none; }
        .ticket-leg-left { flex: 1; min-width: 0; }
        .ticket-leg-match { font-weight: 800; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ticket-leg-sub { font-size: 9px; color: var(--muted); margin-top: 1px; display: flex; gap: 4px; align-items: center; }
        .ticket-leg-fav { color: #0284c7; font-weight: 800; }
        .ticket-leg-right { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
        .ticket-leg-score { font-size: 11px; font-weight: 900; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 1px 5px; border-radius: 4px; color: #0f172a; }
        .ticket-leg-badge { font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
        .pin-match-btn { background: #fffbeb; border: 1px solid #fde68a; color: #b45309; padding: 1px 5px; border-radius: 4px; font-size: 9px; cursor: pointer; font-weight: 800; display: inline-flex; align-items: center; }

        .empty-state { text-align: center; padding: 30px 15px; color: var(--muted); font-size: 12px; }
        .empty-state-card { background: #ffffff; border: 1px solid var(--border); border-radius: 10px; padding: 25px 15px; text-align: center; box-shadow: var(--card-shadow); }
        .empty-icon { font-size: 28px; margin-bottom: 6px; }
        .empty-title { font-weight: 800; font-size: 14px; color: #0f172a; margin-bottom: 3px; }
        .empty-desc { color: var(--muted); font-size: 11px; margin-bottom: 12px; line-height: 1.4; }
        .empty-actions { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }

        @media (min-width: 641px) {
            body { padding-bottom: 20px; }
            .bottom-nav { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="bolt">⚡</span> FLASHSCORE LIVE
                <span class="sub">COMBINÉS</span>
            </div>
            
            <div class="header-actions">
                <button id="soundToggleBtn" class="sound-btn" onclick="toggleSoundAlerts()" title="Activer ou couper la sonnerie douce">
                    <span id="soundIcon">🔔</span> <span id="soundText">Son Doux ⭐</span>
                </button>
                <button id="testSoundBtn" class="sound-btn test-btn" onclick="testGoalSound()" title="Écouter la mélodie douce immédiatement">
                    <span>🎵 Tester</span>
                </button>
                
                <div id="connectionStatus" class="live-badge">
                    <div class="pulse"></div>
                    <span id="connectionText">DIRECT < 1S</span>
                </div>
            </div>
        </header>

        <div class="toolbar">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Rechercher une équipe de nos combinés (Hiroshima, Cherkasy, Machida)...">
            
            <div class="tabs-row">
                <button id="tabAll" class="tab-btn active" onclick="setFilter('all')">Tous (<span id="countAll">0</span>)</button>
                <button id="tabLive" class="tab-btn" onclick="setFilter('live')">🔴 Live (<span id="countLive">0</span>)</button>
                <button id="tabPre" class="tab-btn" onclick="setFilter('pre')">🕒 Pré (<span id="countPre">0</span>)</button>
                <button id="tabFav" class="tab-btn" onclick="setFilter('fav')">⭐ Fav (<span id="countFav">0</span>)</button>
                <button id="tabCombos" class="tab-btn" onclick="setFilter('combos')">🎫 Combos (<span id="countCombos">0</span>)</button>
            </div>
        </div>

        <div id="liveContent">
            <div class="empty-state">Chargement des matchs de vos combinés...</div>
        </div>

        <div id="combosContent" style="display:none;"></div>
    </div>

    <!-- 📱 BARRE DE NAVIGATION BAS -->
    <nav class="bottom-nav">
        <div id="navAll" class="nav-item active" onclick="setFilter('all')">
            <span class="icon">⚽</span>
            <span>Tous</span>
        </div>
        <div id="navLive" class="nav-item" onclick="setFilter('live')">
            <span class="icon">🔴</span>
            <span>Live</span>
        </div>
        <div id="navPre" class="nav-item" onclick="setFilter('pre')">
            <span class="icon">🕒</span>
            <span>Pré</span>
        </div>
        <div id="navFav" class="nav-item" onclick="setFilter('fav')">
            <span class="icon">⭐</span>
            <span>Favoris</span>
        </div>
        <div id="navCombos" class="nav-item" onclick="setFilter('combos')">
            <span class="icon">🎫</span>
            <span>Combos</span>
        </div>
    </nav>

    <script>
        const container = document.getElementById('liveContent');
        const combosContainer = document.getElementById('combosContent');
        const searchInput = document.getElementById('searchInput');
        
        const countAllEl = document.getElementById('countAll');
        const countLiveEl = document.getElementById('countLive');
        const countPreEl = document.getElementById('countPre');
        const countFavEl = document.getElementById('countFav');
        const countCombosEl = document.getElementById('countCombos');
        
        const tabAllBtn = document.getElementById('tabAll');
        const tabLiveBtn = document.getElementById('tabLive');
        const tabPreBtn = document.getElementById('tabPre');
        const tabFavBtn = document.getElementById('tabFav');
        const tabCombosBtn = document.getElementById('tabCombos');

        const navAll = document.getElementById('navAll');
        const navLive = document.getElementById('navLive');
        const navPre = document.getElementById('navPre');
        const navFav = document.getElementById('navFav');
        const navCombos = document.getElementById('navCombos');

        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        let prevScores = {};
        let goalTimestamps = {};
        let activeTab = 'all';
        const GOAL_ALERT_DURATION = 20000;
        let isSoundEnabled = localStorage.getItem('flashscore_sound') !== 'false';
        let failedPollCount = 0;

        // ⚡ CACHE HAUTE PERFORMANCE (ZÉRO LATENCE SUR LES ONGLETS)
        let globalCombosData = null;
        let cachedComboLegs = [];
        let cachedComboGames = [];
        window.latestGames = [];

        let currentMethod = 'm1';
        let currentComboFilter = 'ALL';
        let currentComboStake = 3;

        let favoritesSet = new Set(JSON.parse(localStorage.getItem('flashscore_favs') || '[]'));
        let expandedSet = new Set(JSON.parse(localStorage.getItem('flashscore_expanded') || '[]'));

        function toggleFav(e, id) {
            if (e) e.stopPropagation();
            if (favoritesSet.has(id)) {
                favoritesSet.delete(id);
            } else {
                favoritesSet.add(id);
            }
            localStorage.setItem('flashscore_favs', JSON.stringify(Array.from(favoritesSet)));
            renderFlashscore();
        }

        function toggleExpand(id) {

        // 🎵 CARILLON DOUX & HARMONIEUX (ONDES SINUSOÏDALES PURES)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) audioCtx = new AudioClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        if (typeof document !== 'undefined') {
            document.addEventListener('click', () => { getAudioContext(); }, { once: true });
            document.addEventListener('touchstart', () => { getAudioContext(); }, { once: true });
        }

        let lastSoundTime = 0;
        function playGoalSound() {
            const now = Date.now();
            if (now - lastSoundTime < 2000) return;
            lastSoundTime = now;

            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const t = ctx.currentTime;

                const notes = [
                    { f: 523.25, time: 0.00, dur: 0.5, gain: 0.14 },
                    { f: 659.25, time: 0.11, dur: 0.6, gain: 0.16 },
                    { f: 783.99, time: 0.22, dur: 0.7, gain: 0.18 },
                    { f: 1046.50, time: 0.35, dur: 1.1, gain: 0.22 }
                ];

                notes.forEach(n => {
                    const osc = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(n.f, t + n.time);

                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(n.f * 2, t + n.time);

                    const noteStart = t + n.time;
                    gain.gain.setValueAtTime(0.001, noteStart);
                    gain.gain.linearRampToValueAtTime(n.gain, noteStart + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + n.dur);

                    osc.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(noteStart);
                    osc2.start(noteStart);
                    osc.stop(noteStart + n.dur);
                    osc2.stop(noteStart + n.dur);
                });
            } catch(e) {
                console.warn('Audio error:', e);
            }
        }

        function testGoalSound() {
            try {
                isSoundEnabled = true;
                localStorage.setItem('flashscore_sound', 'true');
                updateSoundBtnUI();

                const ctx = getAudioContext();
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume();

                const testBtn = document.getElementById('testSoundBtn');
                if (testBtn) {

                    testBtn.style.background = '#dcfce7';

            }
        }

        function getStatusPriority(g) {
            if (g.status_type === 'LIVE') {
                if (g.minute === 'PAUSE' || g.minute === 'HT') return 2;

        // ==========================================
        // 🔍 TOKENIZER & DICTIONNAIRE D'ÉQUIPES
        // ==========================================
        const TEAM_ALIASES = {
            'cadix': 'cadiz',
            'gerone': 'girona',
            'mayence': 'mainz',
            'francfort': 'frankfurt',
            'louvain': 'leuven',
            'padoue': 'padova',
            'fribourg': 'freiburg',
            'mgladbach': 'monchengladbach',
            'monchengladbach': 'gladbach',
            'moenchengladbach': 'gladbach',
            'qpr': 'queens park rangers',
            'bilbao': 'athletic',
            'ath bilbao': 'athletic',
            'kyiv': 'kiev',
            'kiev': 'kiev'
        };

        function stripAccents(s) {
            return (s || '').replace(/[øØ]/g, 'o').replace(/[åÅäÄ]/g, 'a').replace(/[öÖ]/g, 'o')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function getTokens(name) {
            let s = stripAccents((name || '').toLowerCase());
            for (let [k, v] of Object.entries(TEAM_ALIASES)) {
                s = s.replace(new RegExp('\\b' + k + '\\b', 'g'), v);
            }
            const clean = s.replace(/[^a-z0-9\s]/g, ' ');
            const words = clean.split(/\s+/).filter(Boolean);
            const stop = new Set(['fc', 'as', 'cf', 'ac', 'sc', 'sk', 'fk', 'sv', 'sp', 'vfb', 'rks', 'cs', 'club', 'de', 'la', 'le', 'the', 'w', 'u21', 'u18', 'u19']);
            const filtered = words.filter(w => !stop.has(w) && w.length >= 3);
            return filtered.length > 0 ? filtered : words;
        }

        function tokenMatch(arr1, arr2) {
            for (let w1 of arr1) {
                for (let w2 of arr2) {
                    if (w1 === w2) return true;
                    if (w1.length >= 4 && w2.length >= 4 && (w1.includes(w2) || w2.includes(w1))) return true;
                }
            }
            return false;
        }

        function isM2Conform(c) {
            if ((c.odds || 0) < 3.50) return false;
            for (let leg of ['m1', 'm2']) {
                const m = c[leg] || {};
                if ((m.odds || 0) < 1.30) return false;
                const sc = m.domination_score;
                if (sc !== undefined && sc !== null && sc < 35) return false;
                if (m.market === 'OVER_15' || m.market === 'BTTS') return false;
                if (m.fav_team === 'Over 1.5 Buts' || m.fav_team === 'Les 2 Marquent') return false;
                if (m.fav_side && m.fav_side !== 'dom') return false;
                if (m.fav_team && m.away && m.fav_team === m.away) return false;
                if (m.away_odds && m.odds >= m.away_odds) return false;
            }
            return true;
        }

        // ==========================================
        // ⚡ PRÉ-COMPILATION ET LIAISON O(1)
        // ==========================================
        function precompileComboLegs() {
            if (!globalCombosData) return;
            const legs = [];
            
            const m1List = globalCombosData.combos_today || [];
            m1List.forEach(c => {
                [c.m1, c.m2].forEach(leg => {
                    if (leg && leg.home && leg.away) {
                        legs.push({
                            leg: leg,
                            ticket: c,
                            method: 'm1',
                            num: c.email_ticket_num || c.ticket_num,
                            tHome: getTokens(leg.home),
                            tAway: getTokens(leg.away),
                            label: `🎫 M1 #${c.email_ticket_num || c.ticket_num}`
                        });
                    }
                });
            });

            const m2List = (globalCombosData.methode2_combos || []).filter(isM2Conform);
            m2List.forEach(c => {
                [c.m1, c.m2].forEach(leg => {
                    if (leg && leg.home && leg.away) {
                        legs.push({
                            leg: leg,
                            ticket: c,
                            method: 'm2',
                            num: c.email_ticket_num || c.ticket_num,
                            tHome: getTokens(leg.home),
                            tAway: getTokens(leg.away),
                            label: `🎯 M2 #${c.email_ticket_num || c.ticket_num}`
                        });
                    }
                });
            });

            cachedComboLegs = legs;
        }

        // Liaison globale rapide effectuée uniquement lors de la réception du flux (1ms)
        function linkGamesAndCombos(allGames) {
            if (!cachedComboLegs.length) precompileComboLegs();
            if (!cachedComboLegs.length || !allGames || !allGames.length) return;

            cachedComboLegs.forEach(cl => { cl.leg._liveGame = null; });
            const matchedGames = [];

            allGames.forEach(g => {
                g._comboTags = [];
                const tDom = getTokens(g.dom);
                const tExt = getTokens(g.ext);

                cachedComboLegs.forEach(cl => {
                    if (tokenMatch(cl.tHome, tDom) && tokenMatch(cl.tAway, tExt)) {
                        cl.leg._liveGame = g;
                        g._comboTags.push({
                            method: cl.method,
                            num: cl.num,
                            label: cl.label,
                            leg: cl.leg,
                            ticket: cl.ticket
                        });
                    }
                });

                if (g._comboTags.length > 0) {
                    matchedGames.push(g);
                }
            });

            cachedComboGames = matchedGames;
            window.latestGames = matchedGames;
        }

        // 👑 STATUT GAGNÉ O(1)
        function getGameWonStatus(g) {
            const tags = g._comboTags || [];
            if (!tags.length) return null;

            for (let t of tags) {
                const leg = t.leg;
                if (!leg) continue;
                const isFavHome = (leg.fav_side === 'dom' || leg.fav_team === leg.home);
                const favScore = isFavHome ? g.score_dom : g.score_ext;
                const oppScore = isFavHome ? g.score_ext : g.score_dom;
                const lead = favScore - oppScore;

                if (lead >= 2) {
                    return { text: '👑 +2b GAGNÉ', type: 'won-lead2' };
                }
                if (g.status_type === 'FINISHED') {
                    if (favScore > oppScore) return { text: '✅ GAGNÉ', type: 'won-final' };
                    return { text: '❌ PERDU', type: 'lost' };
                }
            }

            if (g.status_type === 'LIVE') {
                return { text: '🔴 EN COURS', type: 'live' };
            }
            return null;
        }

        function openComboFromTag(e, method, ticketNum) {
            if (e) e.stopPropagation();
            currentMethod = method;
            setFilter('combos');
        }

        // ==========================================
        // 📊 RENDU FLASHSCORE HAUTE VITESSE (0ms)

            countFavEl.textContent = comboGames.filter(g => favoritesSet.has(g.id)).length;

            if (activeTab === 'combos') {
                renderCombosView();

            if (query) {

                );
            }

            if (activeTab === 'live') {
                filtered = filtered.filter(g => g.status_type === 'LIVE');
            } else if (activeTab === 'pre') {
                filtered = filtered.filter(g => g.status_type === 'PRE_MATCH');
            } else if (activeTab === 'fav') {
                filtered = filtered.filter(g => favoritesSet.has(g.id));
            }

            if (filtered.length === 0) {
                if (activeTab === 'live') {
                    const upcomingCount = comboGames.filter(g => g.status_type === 'PRE_MATCH').length;
                    container.innerHTML = `
                    <div class="empty-state-card">
                        <div class="empty-icon">🎯</div>
                        <div class="empty-title">Aucun match de vos combinés n'est actuellement en direct</div>
                        <div class="empty-desc">
                            ${upcomingCount > 0 ? `${upcomingCount} match(s) de vos combinés sont programmés plus tard aujourd'hui.` : 'Tous les matchs de la session sont terminés ou à venir.'}
                        </div>
                        <div class="empty-actions">

                            <button class="cfilter-btn active" onclick="setFilter('combos')">🎫 Voir les Tickets Combinés</button>

                    container.innerHTML = '<div class="empty-state">Aucun favori. Cliquez sur ★ pour épingler un match de vos combinés.</div>';
                } else {
                    container.innerHTML = '<div class="empty-state">Aucun match de combiné trouvé pour cette recherche.</div>';
                }
                return;
            }

            let html = '';

            // BUTS RÉCENTS (20s)
            const goalAlertMatches = filtered.filter(g => (now - (goalTimestamps[g.id] || 0)) < GOAL_ALERT_DURATION);
            if (goalAlertMatches.length > 0) {
                goalAlertMatches.sort((a, b) => (goalTimestamps[b.id] || 0) - (goalTimestamps[a.id] || 0));

                <div class="league-group" style="border-color:#f87171; margin-bottom: 8px;">
                    <div class="league-header" style="background:#ef4444; color:#fff; font-size: 10px;">
                        <span>⚽ ALERTE BUT (COMBINÉS)</span>
                        <span class="count" style="background:rgba(0,0,0,0.25); color:#fff;">20s</span>
                    </div>
                    ${goalAlertMatches.map(g => renderCompactMatchRow(g, now)).join('')}
                </div>`;
            }

            // FAVORIS
            const favMatches = filtered.filter(g => favoritesSet.has(g.id) && (now - (goalTimestamps[g.id] || 0)) >= GOAL_ALERT_DURATION);
            if (favMatches.length > 0) {
                favMatches.sort((a, b) => getStatusPriority(a) - getStatusPriority(b));
                html += `
                <div class="league-group" style="border-color:#fde68a; margin-bottom: 8px;">
                    <div class="league-header" style="background:#f59e0b; color:#fff; font-size: 10px;">

                        <span class="count" style="background:rgba(0,0,0,0.25); color:#fff;">DIRECT</span>
                    </div>
                    ${favMatches.map(g => renderCompactMatchRow(g, now)).join('')}
                </div>`;
            }

            // MATCHS PAR CHAMPIONNAT
            if (activeTab !== 'fav') {
                const normalMatches = filtered.filter(g => !favoritesSet.has(g.id) && (now - (goalTimestamps[g.id] || 0)) >= GOAL_ALERT_DURATION);
                const leaguesMap = {};
                normalMatches.forEach(g => {
                    leaguesMap[g.league] = leaguesMap[g.league] || [];
                    leaguesMap[g.league].push(g);
                });

                for (const [leagueName, mList] of Object.entries(leaguesMap)) {

                            <span class="count">${mList.length}</span>
                        </div>
                        ${mList.map(g => renderCompactMatchRow(g, now)).join('')}
                    </div>`;
                }
            }

            container.innerHTML = html;
        }

        // ==========================================
        // ⚡ LIGNE COMPACTE (38PX)
        // ==========================================
        function renderCompactMatchRow(g, now) {
            const key = g.id;
            const goalTime = goalTimestamps[key] || 0;
            const isRecentGoal = (now - goalTime) < GOAL_ALERT_DURATION;
            const isStarred = favoritesSet.has(key);
            const isExpanded = expandedSet.has(key);
            const incs = g.incidents || [];
            const comboTags = g._comboTags || [];
            const wonStatus = getGameWonStatus(g);

            const comboTagsHtml = comboTags.map(t => 
                `<span class="badge-combo-indicator" onclick="openComboFromTag(event, '${t.method}', ${t.num})">${t.label}</span>`
            ).join(' ');

            let statusClass = 'status-col';
            let statusText = g.minute;
            if (g.status_type === 'PRE_MATCH') { statusClass += ' pre-match'; statusText = g.kickoff || 'À VENIR'; }
            else if (g.status_type === 'FINISHED') { statusClass += ' finished'; statusText = 'FIN'; }
            if (isRecentGoal) statusText = `⚽ BUT ${g.minute}`;

            const scoreDisplay = (g.status_type === 'PRE_MATCH') ? 'VS' : `${g.score_dom} - ${g.score_ext}`;

            let drawerHtml = '';
            if (isExpanded && incs.length > 0) {
                const pills = incs.map(inc => {
                    const playerName = inc.player ? inc.player.toUpperCase() : 'BUT';
                    if (inc.type === 'penalty') return `<span class="event-pill-mini goal">⚽ ${inc.min}' PENALTY</span>`;
                    if (inc.type === 'goal') return `<span class="event-pill-mini goal">⚽ ${inc.min}' ${playerName}</span>`;
                    if (inc.type === 'csc') return `<span class="event-pill-mini goal">⚽ ${inc.min}' CSC ${playerName}</span>`;
                    if (inc.type === 'card' && inc.card_type === 'red') return `<span class="event-pill-mini redcard">🟥 ${inc.min}' ${playerName}</span>`;
                    return '';
                }).filter(Boolean).join('');

                if (pills) {
                    drawerHtml = `<div class="match-drawer">${pills}</div>`;
                }
            }

            return `
            <div class="match-row ${isRecentGoal ? 'goal-flash' : ''}" onclick="toggleExpand('${key}')">
                <div class="star-col ${isStarred ? 'starred' : ''}" onclick="toggleFav(event, '${key}')">${isStarred ? '★' : '☆'}</div>
                <div class="${statusClass}">${statusText}</div>
                <div class="teams-block">
                    <div class="team-home">${g.dom}</div>
                    <div class="score-box">${scoreDisplay}</div>
                    <div class="team-away">${g.ext}</div>
                </div>
                <div class="won-badge-col">
                    ${wonStatus ? `<span class="score-status-badge ${wonStatus.type}">${wonStatus.text}</span>` : ''}
                </div>
                <div class="combos-tag-col">
                    ${comboTagsHtml}
                </div>
            </div>
            ${drawerHtml}`;
        }

        // ==========================================
        // 🎫 VUE COMBINÉS (CALCUL DIRECT O(1))
        // ==========================================
        function setCombosMethod(m) {
            currentMethod = m;
            renderCombosView();
        }

        function setCombosFilter(f) {
            currentComboFilter = f;
            renderCombosView();
        }

        function setComboStake(stake) {
            currentComboStake = stake;
            renderCombosView();
        }

        function pinComboToFavs(e, h1, a1, h2, a2) {
            if (e) e.stopPropagation();
            if (!cachedComboLegs.length) return;
            let pinned = 0;

            [ [h1, a1], [h2, a2] ].forEach(([h, a]) => {
                const foundLeg = cachedComboLegs.find(cl => cl.leg.home === h && cl.leg.away === a);
                if (foundLeg && foundLeg.leg._liveGame) {
                    favoritesSet.add(foundLeg.leg._liveGame.id);
                    pinned++;
                }
            });

            localStorage.setItem('flashscore_favs', JSON.stringify(Array.from(favoritesSet)));
            if (pinned > 0) alert(`✅ ${pinned} match(s) épinglé(s) dans vos Favoris ⭐ !`);
            countFavEl.textContent = favoritesSet.size;
            renderCombosView();
        }

        function renderCombosView() {
            if (!globalCombosData) {
                combosContainer.innerHTML = '<div class="empty-state">Chargement des combinés en direct...</div>';
                return;
            }

            const m1List = globalCombosData.combos_today || [];
            const m2List = (globalCombosData.methode2_combos || []).filter(isM2Conform);
            const activeList = (currentMethod === 'm1') ? m1List : m2List;

            const evaluatedList = activeList.map(c => {
                const evalRes = evalTicketLive(c);
                return { ...c, live_eval: evalRes };
            });

            let won = 0, lost = 0, live = 0, upcoming = 0;
            let profitUnits = 0.0;

            evaluatedList.forEach(c => {
                const st = c.live_eval.ticketStatus;
                if (st === 'WON') {
                    won++;
                    profitUnits += (c.odds - 1.0);
                } else if (st === 'LOST') {
                    lost++;
                    profitUnits -= 1.0;
                } else if (st === 'LIVE') {
                    live++;
                } else {
                    upcoming++;
                }
            });

            const decided = won + lost;
            const winRate = decided > 0 ? ((won / decided) * 100).toFixed(1) : '0.0';
            const roiPct = decided > 0 ? ((profitUnits / decided) * 100).toFixed(1) : '0.0';
            const profitEur = (profitUnits * currentComboStake).toFixed(2);

            let filtered = evaluatedList.filter(c => {
                const st = c.live_eval.ticketStatus;
                if (currentComboFilter === 'LIVE') return st === 'LIVE';
                if (currentComboFilter === 'WON') return st === 'WON';
                if (currentComboFilter === 'LOST') return st === 'LOST';
                if (currentComboFilter === 'PENDING') return st === 'PENDING';
                return true;
            });

            let html = `
            <div class="combos-container-view">
                <div class="combos-subtabs">
                    <div class="subtab-btn ${currentMethod === 'm1' ? 'active' : ''}" onclick="setCombosMethod('m1')">
                        🎟️ Méthode 1 (+2b) (${m1List.length})
                    </div>
                    <div class="subtab-btn ${currentMethod === 'm2' ? 'active-m2' : ''}" onclick="setCombosMethod('m2')">
                        🎯 Méthode 2 (@3.50+) (${m2List.length})
                    </div>
                </div>

                <div class="combos-kpi-grid">
                    <div class="combos-kpi-card">
                        <div class="combos-kpi-val" style="color:#10b981;">${won}/${decided}</div>
                        <div class="combos-kpi-sub">Gagnés</div>
                    </div>
                    <div class="combos-kpi-card">
                        <div class="combos-kpi-val" style="color:#f59e0b;">${winRate}%</div>
                        <div class="combos-kpi-sub">Réussite</div>
                    </div>
                    <div class="combos-kpi-card">
                        <div class="combos-kpi-val" style="color:${profitEur >= 0 ? '#10b981' : '#ef4444'};">${profitEur >= 0 ? '+' : ''}${profitEur} €</div>
                        <div class="combos-kpi-sub">Gain (${profitUnits >= 0 ? '+' : ''}${profitUnits.toFixed(1)}U)</div>
                    </div>
                    <div class="combos-kpi-card">
                        <div class="combos-kpi-val" style="color:${roiPct >= 0 ? '#10b981' : '#ef4444'};">${roiPct >= 0 ? '+' : ''}${roiPct}%</div>
                        <div class="combos-kpi-sub">ROI</div>
                    </div>
                </div>

                <div class="stake-bar-mini">
                    <span>Mise / Ticket :</span>
                    <div style="display:flex; gap:3px;">
                        ${[3, 5, 10, 20].map(s => `
                            <button class="stake-btn-mini ${currentComboStake === s ? 'active' : ''}" onclick="setComboStake(${s})">${s}€</button>
                        `).join('')}
                    </div>
                </div>

                <div class="combos-filters-row">
                    <button class="cfilter-btn ${currentComboFilter === 'ALL' ? 'active' : ''}" onclick="setCombosFilter('ALL')">Tous (${activeList.length})</button>
                    <button class="cfilter-btn ${currentComboFilter === 'LIVE' ? 'active' : ''}" onclick="setCombosFilter('LIVE')">🔴 Live (${live})</button>
                    <button class="cfilter-btn ${currentComboFilter === 'WON' ? 'active' : ''}" onclick="setCombosFilter('WON')">✅ Gagnés (${won})</button>
                    <button class="cfilter-btn ${currentComboFilter === 'LOST' ? 'active' : ''}" onclick="setCombosFilter('LOST')">❌ Perdus (${lost})</button>
                    <button class="cfilter-btn ${currentComboFilter === 'PENDING' ? 'active' : ''}" onclick="setCombosFilter('PENDING')">⏳ À venir (${upcoming})</button>
                </div>
            `;

            if (filtered.length === 0) {
                html += '<div class="empty-state">Aucun combiné dans ce filtre.</div></div>';
                combosContainer.innerHTML = html;
                return;
            }

            html += filtered.map(c => {
                const tSt = c.live_eval.ticketStatus;
                const isWon = (tSt === 'WON');
                const isLost = (tSt === 'LOST');
                const isLive = (tSt === 'LIVE');

                let cardClass = 'ticket-card';
                if (isWon) cardClass += ' is-won';
                else if (isLost) cardClass += ' is-lost';
                else if (isLive) cardClass += ' is-live';

                let resBadge = '<span class="ticket-res-badge pending">⏳ À VENIR</span>';
                let gainText = `Gain pot. : ${(c.odds * currentComboStake).toFixed(2)} €`;
                let gainColor = '#0284c7';

                if (isWon) {
                    resBadge = '<span class="ticket-res-badge won">✅ GAGNÉ</span>';
                    const net = ((c.odds - 1.0) * currentComboStake).toFixed(2);
                    gainText = `+${net} € Net`;
                    gainColor = '#10b981';
                } else if (isLost) {
                    resBadge = '<span class="ticket-res-badge lost">❌ PERDU</span>';
                    gainText = `-${currentComboStake.toFixed(2)} €`;
                    gainColor = '#ef4444';
                } else if (isLive) {
                    resBadge = '<span class="ticket-res-badge live">🔴 EN COURS</span>';
                    gainText = `En jeu (${(c.odds * currentComboStake).toFixed(2)} €)`;
                    gainColor = '#d97706';
                }

                const title = c.email_ticket_num 
                    ? `TICKET #${c.email_ticket_num} DU MAIL` 
                    : `COMBINÉ #${c.ticket_num}`;

                function renderLegHtml(m, legEval) {
                    if (!m) return '';
                    const legWon = legEval.selStatus && legEval.selStatus.startsWith('WON');
                    const legLost = (legEval.selStatus === 'LOST');
                    const legLive = (legEval.isLive || legEval.selStatus === 'LIVE');
                    const isGoalNow = legEval.isRecentGoal;

                    let legBadge = '<span class="ticket-leg-badge" style="background:#f1f5f9; color:#64748b;">⏳ À venir</span>';
                    if (isGoalNow) {
                        legBadge = '<span class="ticket-leg-badge" style="background:#ef4444; color:#ffffff; font-weight:900;">⚽ BUT !</span>';
                    } else if (legEval.selStatus === 'WON_LEAD2') {
                        legBadge = '<span class="ticket-leg-badge" style="background:#dcfce7; color:#15803d; font-weight:900;">👑 +2b Gagné</span>';
                    } else if (legWon) {
                        legBadge = '<span class="ticket-leg-badge" style="background:#dcfce7; color:#15803d; font-weight:900;">✅ Victoire</span>';
                    } else if (legLost) {
                        legBadge = '<span class="ticket-leg-badge" style="background:#fee2e2; color:#b91c1c; font-weight:900;">❌ Perdu</span>';
                    } else if (legLive) {
                        legBadge = `<span class="ticket-leg-badge" style="background:#fef3c7; color:#b45309; font-weight:800;">🔴 ${legEval.min}</span>`;
                    }

                    const favLabel = m.fav_team ? `👑 ${m.fav_team}` : (m.home || '');

                    return `
                    <div class="ticket-leg ${isGoalNow ? 'goal-flash' : ''}">
                        <div class="ticket-leg-left">
                            <div class="ticket-leg-match">${m.home} vs ${m.away}</div>
                            <div class="ticket-leg-sub">
                                <span>🕒 ${m.time ? m.time.replace(' à ', ' ') : ''}</span>
                                <span class="ticket-leg-fav">${favLabel} @${(m.odds || 0).toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="ticket-leg-right">
                            <div class="ticket-leg-score">${legEval.score}</div>
                            ${legBadge}
                        </div>
                    </div>`;
                }

                return `
                <div class="${cardClass}">
                    <div class="ticket-header">
                        <div style="display:flex; align-items:center; gap:5px;">
                            <span>${title}</span>
                            <span class="ticket-odds-badge">@${(c.odds || 0).toFixed(2)}</span>
                            <button class="pin-match-btn" onclick="pinComboToFavs(event, '${c.m1?.home||''}', '${c.m1?.away||''}', '${c.m2?.home||''}', '${c.m2?.away||''}')" title="Épingler dans vos favoris">⭐ Suivre</button>
                        </div>
                        <div style="display:flex; align-items:center; gap:5px;">
                            ${resBadge}
                            <span style="color:${gainColor}; font-size:10px; font-weight:900;">${gainText}</span>
                        </div>
                    </div>
                    <div class="ticket-legs">
                        ${renderLegHtml(c.m1, c.live_eval.l1)}
                        ${renderLegHtml(c.m2, c.live_eval.l2)}
                    </div>
                </div>`;
            }).join('');

            html += '</div>';
            combosContainer.innerHTML = html;
        }

        // ⚡ ÉVALUATION INSTANTANÉE O(1) GRÂCE AU POINTEUR DIRECT
        function evalLegLive(m) {
            if (!m) return { status: 'UPCOMING', selStatus: 'PENDING', score: 'VS', min: 'À venir', isLive: false, isRecentGoal: false };
            let selStatus = m.selection_status || 'PENDING';
            let status = m.status || 'UPCOMING';
            let score = (m.home_score !== null && m.home_score !== undefined && m.away_score !== null && m.away_score !== undefined) 
                ? `${m.home_score} - ${m.away_score}` 
                : (m.score_display || 'VS');
            let min = m.minute || (m.time ? m.time.replace(' à ', ' ') : 'À venir');
            let isLive = (status === 'LIVE');
            let isRecentGoal = false;

            const g = m._liveGame; // ⚡ O(1) IMMÉDIAT
            if (g) {
                score = `${g.score_dom} - ${g.score_ext}`;
                min = g.minute;
                status = g.status_type;
                isLive = (g.status_type === 'LIVE');
                isRecentGoal = (Date.now() - (goalTimestamps[g.id] || 0)) < GOAL_ALERT_DURATION;

                const isFavHome = (m.fav_side === 'dom' || m.fav_team === m.home);
                const favScore = isFavHome ? g.score_dom : g.score_ext;
                const oppScore = isFavHome ? g.score_ext : g.score_dom;
                const lead = favScore - oppScore;

                if (lead >= 2) {
                    selStatus = 'WON_LEAD2';
                } else if (g.status_type === 'FINISHED') {
                    if (favScore > oppScore) return { status, selStatus: 'WON_FINAL', score, min, isLive, isRecentGoal };
                    else selStatus = 'LOST';
                } else if (g.status_type === 'LIVE') {
                    selStatus = 'LIVE';
                }
            }
            return { status, selStatus, score, min, isLive, isRecentGoal };
        }

        function evalTicketLive(c) {
            const l1 = evalLegLive(c.m1);
            const l2 = evalLegLive(c.m2);

            let ticketStatus = c.ticket_status;
            const w1 = l1.selStatus.startsWith('WON');
            const w2 = l2.selStatus.startsWith('WON');
            const lost1 = (l1.selStatus === 'LOST');
            const lost2 = (l2.selStatus === 'LOST');
            const live1 = (l1.selStatus === 'LIVE' || l1.isLive);
            const live2 = (l2.selStatus === 'LIVE' || l2.isLive);

            if (lost1 || lost2) {
                ticketStatus = 'LOST';
            } else if (w1 && w2) {
                ticketStatus = 'WON';
            } else if (live1 || live2 || w1 || w2) {
                ticketStatus = 'LIVE';
            }

            return { ticketStatus, l1, l2 };
        }

        async function fetchCombosData() {
            try {
                let res = await fetch('/api/combos?t=' + Date.now());
                if (!res.ok) {
                    res = await fetch('https://mto-user84925.github.io/penalty/data.json?t=' + Date.now());
                }
                if (res.ok) {
                    globalCombosData = await res.json();
                    precompileComboLegs();
                    const m1Count = (globalCombosData.combos_today || []).length;
                    const m2Count = (globalCombosData.methode2_combos || []).filter(isM2Conform).length;
                    if (countCombosEl) countCombosEl.textContent = m1Count + m2Count;
                    if (activeTab === 'combos') renderCombosView();
                    else renderFlashscore();
                }
            } catch(e) {
                try {
                    const res = await fetch('https://mto-user84925.github.io/penalty/data.json?t=' + Date.now());
                    if (res.ok) {
                        globalCombosData = await res.json();
                        precompileComboLegs();
                        const m1Count = (globalCombosData.combos_today || []).length;
                        const m2Count = (globalCombosData.methode2_combos || []).filter(isM2Conform).length;
                        if (countCombosEl) countCombosEl.textContent = m1Count + m2Count;
                        if (activeTab === 'combos') renderCombosView();
                        else renderFlashscore();
                    }
                } catch(err) {}
            }
        }

        function pollCombosLoop() {
            fetchCombosData();
            setTimeout(pollCombosLoop, 15000);
        }
        pollCombosLoop();

        async function pollLiveLoop() {
            try {
                const res = await fetch('/api/live?t=' + Date.now());
                if (res.ok) {
                    const allFeedData = await res.json();
                    failedPollCount = 0;
                    connectionStatus.className = 'live-badge';
                    connectionText.textContent = 'DIRECT < 1S';
                    
                    // ⚡ LIAISON UNIQUE ET DÉTECTION DE BUT
                    linkGamesAndCombos(allFeedData);

                    // Détection des buts
                    const now = Date.now();
                    cachedComboGames.forEach(g => {
                        const key = g.id;
                        const scoreStr = `${g.score_dom}-${g.score_ext}`;
                        if (prevScores[key] !== undefined && prevScores[key] !== scoreStr) {
                            goalTimestamps[key] = now;
                            sendSystemNotification(g);
                            if (isSoundEnabled) playGoalSound();
                        }
                        prevScores[key] = scoreStr;
                    });

                    if (activeTab === 'combos') renderCombosView();
                    else renderFlashscore();
                } else {
                    failedPollCount++;
                    if (failedPollCount >= 3) {
                        connectionStatus.className = 'live-badge offline';
                        connectionText.textContent = 'RECONNEXION...';
                    }
                }
            } catch (e) {
                failedPollCount++;
                if (failedPollCount >= 3) {
                    connectionStatus.className = 'live-badge offline';
                    connectionText.textContent = 'RECONNEXION...';
                }
            } finally {
                setTimeout(pollLiveLoop, 1500); // 1.5s = fréquence idéale, laisse 100% de CPU libre
            }
        }

        pollLiveLoop();

        searchInput.addEventListener('input', () => {
            renderFlashscore();
        });

        let swRegistration = null;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => {
                    swRegistration = reg;
                })
                .catch(err => console.warn('[SW] Échec enregistrement:', err));
        }
    </script>
</body>
</html>
